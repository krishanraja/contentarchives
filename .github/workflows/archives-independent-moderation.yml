# Independent sexual-content audit for archives.krishraja.com.
#
# The normal writer already applies the library's Gemini sensitivity gate.
# This workflow re-checks the actual visible site population with OpenAI's free
# image moderation endpoint: every visible still, and one frame per second plus
# scene changes for every playable video. Results checkpoint per sample.
#
# This repository and its Actions logs are public. The worker prints counts
# only. Add OPENAI_API_KEY through Settings > Secrets and variables > Actions;
# never put it in this file, a command line, an issue, or chat.
#
# Scheduled maintenance is deliberately off until the first full audit is
# complete. Set the repository variable ARCHIVES_INDEPENDENT_AUDIT to "on" to
# keep new arrivals covered nightly. Manual runs always work.

name: Archives independent moderation

on:
  schedule:
    - cron: "47 19 * * *"
  workflow_dispatch:
    inputs:
      items:
        description: "Most archive items started (0 means no item limit)"
        required: false
        default: "0"
      samples:
        description: "Most image samples sent (0 means no sample limit)"
        required: false
        default: "0"
      workers:
        description: "Moderation requests in flight"
        required: false
        default: "8"
      require_complete:
        description: "Fail unless every currently visible item is cleared"
        type: boolean
        required: false
        default: false
      test_only:
        description: "Run the synthetic and database checks without touching production"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: archives-independent-moderation
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ARCHIVES_INDEPENDENT_AUDIT == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stages/13_app/requirements-cloud.txt
      - run: pip install -r stages/13_app/requirements-cloud.txt
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg)
      - name: the cloud writer and independent audit tests
        env:
          TEST_PG_DSN: postgresql://postgres:pw@127.0.0.1:54329/postgres
        run: python tests/test_app_cloud.py
      - run: python tests/test_app_share_set.py
      - run: python tests/test_stage_contracts.py

  audit:
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.test_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stages/13_app/requirements-cloud.txt
      - run: pip install -r stages/13_app/requirements-cloud.txt
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg)
      - name: audit the site's visible media
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODERATION_ITEMS_PER_RUN: ${{ inputs.items || '0' }}
          MODERATION_SAMPLES_PER_RUN: ${{ inputs.samples || '0' }}
          MODERATION_WORKERS: ${{ inputs.workers || '8' }}
          MODERATION_MAX_MINUTES: "320"
        run: >-
          python stages/13_app/independent_moderation.py
          ${{ inputs.require_complete && '--require-complete' || '' }}
